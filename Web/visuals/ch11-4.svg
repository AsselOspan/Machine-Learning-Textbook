<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 360" role="img" aria-labelledby="title desc"><title id="title">Бір шығарылым және жаңартылатын болжам</title><desc id="desc">4-сәтте y₄ = 15 белгілі болғанда 5-сәтке 17 болжанады. 5-сәтте y₅ = 16 түскенде 6-сәтке 18 болжанады. Модель параметрлері өзгермейді.</desc><rect width="720" height="360" fill="#f7fafc"/><g font-family="DejaVu Sans, Segoe UI, Arial, sans-serif" stroke-linejoin="round" stroke-linecap="round"><text x="650" y="52" text-anchor="end" fill="#52667d" font-size="17">Уақыт</text>
