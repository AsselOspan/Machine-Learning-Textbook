<text x="360.0" y="213.0" text-anchor="middle" fill="#087f8c" font-size="20">p ≥ t</text>
<text x="360" y="282" text-anchor="middle" fill="#087f8c" font-size="24" font-weight="700">Шарт орындалса → болжам 1</text></g></svg>
