<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 360" role="img" aria-labelledby="title desc"><title id="title">Шешім шегі қателерді қалай өзгертеді?</title><desc id="desc">Оң класс үшін ықтималдық бағасын p деп аламыз. p ≥ t болса, модель 1 класын береді.</desc><rect width="720" height="360" fill="#f7fafc"/><g font-family="DejaVu Sans, Segoe UI, Arial, sans-serif" stroke-linejoin="round" stroke-linecap="round"><rect x="190" y="45" width="340" height="72" rx="8" fill="#e0f2f4" stroke="#087f8c" stroke-width="2"/>
