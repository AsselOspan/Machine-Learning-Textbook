<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 360" role="img" aria-labelledby="title desc"><title id="title">Iris деректерінен модельді бағалауға дейін</title><desc id="desc">Бекітілген модель тестте 30 гүлдің 28-ін дұрыс жіктеді. Ең жиі класты таңдайтын базалық модель 10 гүлді дұрыс жіктеді.</desc><rect width="720" height="360" fill="#f7fafc"/><g font-family="DejaVu Sans, Segoe UI, Arial, sans-serif" stroke-linejoin="round" stroke-linecap="round"><rect x="230" y="31" width="260" height="70" rx="8" fill="#e0f2f4" stroke="#087f8c" stroke-width="2"/>
<text x="360.0" y="61.0" text-anchor="middle" fill="#123656" font-size="19" font-weight="700">Iris жиынтығы</text>
<text x="360.0" y="91.0" text-anchor="middle" fill="#087f8c" font-size="20">150 гүл · 3 класс</text>
<path d="M 360 101 V 130 H 194 V 158 M 360 130 H 526 V 158" stroke="#52667d" stroke-width="2" fill="none"/>
<rect x="63" y="160" width="262" height="75" rx="8" fill="#e0f2f4" stroke="#087f8c" stroke-width="2"/>
<text x="194.0" y="192.5" text-anchor="middle" fill="#123656" font-size="19" font-weight="700">Оқыту жиыны</text>
<text x="194.0" y="222.5" text-anchor="middle" fill="#087f8c" font-size="20">120 · әр кластан 40</text>
<rect x="395" y="160" width="262" height="75" rx="8" fill="#e0f2f4" stroke="#087f8c" stroke-width="2"/>
<text x="526.0" y="192.5" text-anchor="middle" fill="#123656" font-size="19" font-weight="700">Тест жиыны</text>
<text x="526.0" y="222.5" text-anchor="middle" fill="#087f8c" font-size="20">30 · әр кластан 10</text>
<line x1="526" y1="235" x2="526" y2="262" stroke="#52667d" stroke-width="3"/>
<path d="M 520 254 L 526 262 L 532 254" stroke="#52667d" stroke-width="3" fill="none"/>
