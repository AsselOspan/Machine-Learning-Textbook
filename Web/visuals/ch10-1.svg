<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 360" role="img" aria-labelledby="title desc"><title id="title">Шепли мәндерінде үлесті екі ретпен есептеу</title><desc id="desc">Модель f(x₁,x₂)=x₁+2x₂+3x₁x₂. Түсіндірілетін нысан (1, 1), ал ашылмаған белгілердің мәндері (0, 0) фондық жолынан алынады. База — 0.</desc><rect width="720" height="360" fill="#f7fafc"/><g font-family="DejaVu Sans, Segoe UI, Arial, sans-serif" stroke-linejoin="round" stroke-linecap="round"><line x1="76" y1="272" x2="660" y2="272" stroke="#d8e2ee" stroke-width="1"/>
