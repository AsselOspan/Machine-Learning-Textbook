<text x="42" y="154" text-anchor="start" fill="#52667d" font-size="16" font-weight="700">Бақылау</text>
<text x="42" y="220" text-anchor="start" fill="#52667d" font-size="16" font-weight="700">Бір шығарылым</text>
<text x="42" y="286" text-anchor="start" fill="#52667d" font-size="16" font-weight="700">Жаңартылатын</text>
<rect x="150" y="130" width="60" height="38" rx="8" fill="#ffffff" stroke="#52667d" stroke-width="2"/>
<text x="180" y="155" text-anchor="middle" fill="#123656" font-size="20" font-weight="700">10</text>
<text x="360" y="327" text-anchor="middle" fill="#52667d" font-size="17">Болжам = алдыңғы мән + 2</text></g></svg>
