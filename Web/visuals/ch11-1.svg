<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 360" role="img" aria-labelledby="title desc"><title id="title">Бір шығарылым және жаңартылатын болжам</title><desc id="desc">3-сәтте соңғы белгілі бақылау y₃ = 10. 4, 5 және 6-сәттердің нақты мәндері әлі қолжетімді емес.</desc><rect width="720" height="360" fill="#f7fafc"/><g font-family="DejaVu Sans, Segoe UI, Arial, sans-serif" stroke-linejoin="round" stroke-linecap="round"><text x="650" y="52" text-anchor="end" fill="#52667d" font-size="17">Уақыт</text>
<line x1="147" y1="78" x2="650" y2="78" stroke="#52667d" stroke-width="2"/>
<line x1="643" y1="74" x2="650" y2="78" stroke="#52667d" stroke-width="2"/>
<line x1="643" y1="82" x2="650" y2="78" stroke="#52667d" stroke-width="2"/>
<line x1="180" y1="73" x2="180" y2="83" stroke="#52667d" stroke-width="2"/>
<text x="180" y="108" text-anchor="middle" fill="#52667d" font-size="17">3-сәт</text>
<line x1="180" y1="118" x2="180" y2="311" stroke="#d8e2ee" stroke-width="1" stroke-dasharray="3 5"/>
<line x1="320" y1="73" x2="320" y2="83" stroke="#52667d" stroke-width="2"/>
<text x="320" y="108" text-anchor="middle" fill="#52667d" font-size="17">4-сәт</text>
<line x1="320" y1="118" x2="320" y2="311" stroke="#d8e2ee" stroke-width="1" stroke-dasharray="3 5"/>
<line x1="460" y1="73" x2="460" y2="83" stroke="#52667d" stroke-width="2"/>
<text x="460" y="108" text-anchor="middle" fill="#52667d" font-size="17">5-сәт</text>
<line x1="460" y1="118" x2="460" y2="311" stroke="#d8e2ee" stroke-width="1" stroke-dasharray="3 5"/>
<line x1="600" y1="73" x2="600" y2="83" stroke="#52667d" stroke-width="2"/>
<text x="600" y="108" text-anchor="middle" fill="#52667d" font-size="17">6-сәт</text>
