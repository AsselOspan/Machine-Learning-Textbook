<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 360" role="img" aria-labelledby="title desc"><title id="title">Шешім ағашы шекті қалай бағалайды?</title><desc id="desc">8 нысанның бесеуі A, үшеуі B класына жатады. Түбірдегі Gini мәні 15/32.</desc><rect width="720" height="360" fill="#f7fafc"/><g font-family="DejaVu Sans, Segoe UI, Arial, sans-serif" stroke-linejoin="round" stroke-linecap="round"><rect x="228" y="29" width="264" height="73" rx="8" fill="#e0f2f4" stroke="#087f8c" stroke-width="2"/>
<text x="360.0" y="60.5" text-anchor="middle" fill="#123656" font-size="19" font-weight="700">Түбір</text>
<text x="360.0" y="90.5" text-anchor="middle" fill="#087f8c" font-size="20">5 A · 3 B</text>
<text x="360" y="175" text-anchor="middle" fill="#087f8c" font-size="29" font-weight="700">Gini = 15/32</text></g></svg>
